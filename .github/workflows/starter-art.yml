name: Starter art

# Run from the Actions tab. Generates anime profile pictures and chat
# backgrounds for the Explore characters and pushes them to the
# "starter-art" branch, ready to merge. Needs the FAL_KEY secret (fal.ai)
# or OPENROUTER_API_KEY.
on:
  workflow_dispatch:
    inputs:
      characters:
        description: "Only these (space separated, e.g. 'luna kai'). Empty = all 8."
        required: false
        default: ""
      model:
        description: "fal.ai model (with FAL_KEY) or OpenRouter image model. Empty = default."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install --no-save --no-package-lock sharp

      - name: Generate images
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FAL_MODEL: ${{ inputs.model }}
          IMAGE_MODEL: ${{ inputs.model }}
          CHARACTERS: ${{ inputs.characters }}
        run: node scripts/generate-starter-art.mjs $CHARACTERS

      - name: Push to starter-art branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B starter-art
          git add assets/starters
          git commit -m "Starter art: anime profiles and backgrounds"
          git push -f origin starter-art

      - name: Open pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base "${{ github.ref_name }}" --head starter-art \
            --title "Starter art: anime profiles and backgrounds" \
            --body "Generated by the Starter art workflow." || true
